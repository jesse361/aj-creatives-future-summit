<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book now · AJ Laundry Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="brand-mark">AJ</span> Laundry Services</a>
      <button class="nav-toggle" type="button" aria-label="Open menu">Menu</button>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a class="active" href="contact.html">Contact</a>
        <a class="btn btn-light" href="contact.html">Book now</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Doorstep pickup</p>
      <h1>Book a laundry pickup in Sodala.</h1>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:720px">
      <form id="contact-form" class="form">
        <div class="form-row">
          <label>Name <input name="name" required></label>
          <label>Phone <input name="phone" required></label>
        </div>
        <label>Pickup address <input name="address" required placeholder="House / street, Sodala"></label>
        <div class="form-row">
          <label>Service
            <select name="service">
              <option>Dry cleaning</option>
              <option>Wash &amp; steam iron</option>
              <option>Shoe cleaning</option>
              <option>Stain removal</option>
              <option>Curtain &amp; home care</option>
            </select>
          </label>
          <label>Preferred time
            <select name="time">
              <option>Morning</option>
              <option>Afternoon</option>
              <option>Evening</option>
            </select>
          </label>
        </div>
        <label>Notes <textarea name="message" rows="4" placeholder="Fabric type, stains, or delivery date"></textarea></label>
        <button class="btn btn-teal" type="submit">Book now</button>
        <p id="form-status"></p>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-row">
      <div>AJ Laundry Services</div>
      <div>Sodala, Jaipur</div>
      <div>hello@ajlaundryservices.com</div>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
